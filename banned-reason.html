<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏政策与服务条款 - 帮助中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --google-blue: #1a73e8;
            --text-dark: #202124;
            --text-light: #5f6368;
            --border-color: #dadce0;
            --bg-gray: #f8f9fa;
        }

        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background-color: #fff;
            color: var(--text-dark);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            /* 禁止复制 */
            user-select: none;
            -webkit-user-select: none;
        }

        /* 顶部导航栏 */
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            color: var(--text-light);
            display: flex;
            align-items: center;
        }

        .logo strong {
            color: var(--text-dark);
            margin-right: 5px;
            font-weight: 600;
        }

        /* 主体容器 */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* 搜索框模拟 */
        .search-bar {
            background: var(--bg-gray);
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 40px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            border: 1px solid transparent;
        }

        /* 文章样式 */
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 30px;
        }

        section {
            margin-bottom: 40px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 30px;
            color: var(--text-dark);
        }

        ul {
            padding-left: 20px;
            list-style-type: disc;
        }

        li {
            margin-bottom: 12px;
            color: var(--text-light);
        }

        li strong {
            color: var(--text-dark);
        }

        /* 警告框 */
        .warning-box {
            background-color: #fce8e6;
            border-left: 4px solid #d93025;
            padding: 16px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .warning-box p {
            margin: 0;
            color: #b31412;
            font-weight: 600;
        }

        /* 底部 */
        footer {
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
            padding: 24px;
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
        }

        .btn-start {
            display: inline-block;
            background-color: var(--google-blue);
            color: white;
            padding: 10px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-start:hover {
            background-color: #185abc;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

    </style>
</head>
<body oncontextmenu="return false;"> <header>
    <li><strong>此页面开发者尚未撰写完成。</strong></li>
</body>
</html>
